name: Build Native C++ Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Gatito Dtb Pacher
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            make
            flex
            bison
            pkgconf
            diffutils
            mingw-w64-ucrt-x86_64-gcc

      - name: Build official DTC sources
        shell: msys2 {0}
        run: |
          rm -rf /tmp/dtc
          git clone --depth 1 https://github.com/dgibson/dtc.git /tmp/dtc
          cd /tmp/dtc
          # Keep the embedded bridge header inside the MSYS2 tree so GCC's
          # generated Make dependency files never contain a Windows drive-letter colon.
          cp "$GITHUB_WORKSPACE/native/dtc_bridge.h" ./dtc_bridge.h
          # The upstream helper is private to dtc.c; expose only that helper
          # so the embedded bridge can reproduce the CLI check sequence.
          sed -i -e 's/fill_fullpaths/dtbp_fill_fullpaths/g' -e 's/^static void dtbp_fill_fullpaths/void dtbp_fill_fullpaths/' dtc.c
          # Do not invoke the deprecated upstream Makefile here: its default
          # target graph always includes the legacy convert-dtsv0 utility.
          # Generate and compile only the DTC core and libfdt objects needed
          # by the embedded application.
          bison -d -o dtc-parser.tab.c dtc-parser.y
          flex -o dtc-lexer.lex.c dtc-lexer.l
          for src in checks.c data.c flattree.c fstree.c livetree.c srcpos.c treesource.c util.c; do
            obj="${src%.c}.o"
            gcc -DNO_YAML -Dexit=dtbp_dtc_exit -include dtc_bridge.h -I. -Ilibfdt -c "$src" -o "$obj"
          done
          gcc -DNO_YAML -Dexit=dtbp_dtc_exit -include dtc_bridge.h -I. -Ilibfdt -c dtc-lexer.lex.c -o dtc-lexer.lex.o
          gcc -DNO_YAML -Dexit=dtbp_dtc_exit -include dtc_bridge.h -I. -Ilibfdt -c dtc-parser.tab.c -o dtc-parser.tab.o
          for src in fdt.c fdt_ro.c fdt_wip.c fdt_sw.c fdt_rw.c fdt_strerror.c fdt_empty_tree.c fdt_addresses.c fdt_overlay.c fdt_check.c; do
            obj="${src%.c}.o"
            gcc -I. -Ilibfdt -c "libfdt/$src" -o "libfdt/$obj"
          done
          ar rcs libfdt/libfdt.a libfdt/*.o

      - name: Compile native Gatito Dtb Pacher
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          DTC=/tmp/dtc
          mkdir -p build
          gcc -Dmain=dtc_internal_main -DNO_YAML -Dexit=dtbp_dtc_exit -include "$DTC/dtc_bridge.h" -I"$DTC" -I"$DTC/libfdt" -c "$DTC/dtc.c" -o build/dtc_embedded.o
          gcc -DNO_YAML -I"$DTC" -I"$DTC/libfdt" -c native/dtc_bridge.c -o build/dtc_bridge.o
          g++ -std=c++17 -O2 -mwindows -I"$DTC" -I"$DTC/libfdt" native/main.cpp native/dtb_model.cpp build/dtc_bridge.o build/dtc_embedded.o "$DTC/checks.o" "$DTC/data.o" "$DTC/flattree.o" "$DTC/fstree.o" "$DTC/livetree.o" "$DTC/srcpos.o" "$DTC/treesource.o" "$DTC/util.o" "$DTC/dtc-lexer.lex.o" "$DTC/dtc-parser.tab.o" "$DTC/libfdt/libfdt.a" -static -static-libgcc -static-libstdc++ -lgdiplus -lcomctl32 -o build/Gatito-Dtb-Pacher.exe

      - name: Native DTC smoke test
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          DTC=/tmp/dtc
          g++ -std=c++17 -O2 -I"$DTC" -I"$DTC/libfdt" native/test_dtc.cpp build/dtc_bridge.o build/dtc_embedded.o "$DTC/checks.o" "$DTC/data.o" "$DTC/flattree.o" "$DTC/fstree.o" "$DTC/livetree.o" "$DTC/srcpos.o" "$DTC/treesource.o" "$DTC/util.o" "$DTC/dtc-lexer.lex.o" "$DTC/dtc-parser.tab.o" "$DTC/libfdt/libfdt.a" -static-libgcc -static-libstdc++ -o build/test_dtc.exe
          ./build/test_dtc.exe tests/native-smoke.dts build/smoke

      - name: Semantic transfer model smoke test
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          g++ -std=c++17 -O2 native/test_model.cpp native/dtb_model.cpp -o build/test_model.exe
          ./build/test_model.exe tests/semantic-donor.dts tests/semantic-receiver.dts

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\\Gatito-Dtb-Pacher.exe")) { throw "Native executable was not produced." }
          Get-Item "build\\Gatito-Dtb-Pacher.exe" | Select-Object FullName,Length

      - name: Verify runtime dependencies
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          deps="$(ldd build/Gatito-Dtb-Pacher.exe 2>/dev/null || true)"
          echo "$deps"
          if echo "$deps" | grep -Eiq 'libwinpthread|libstdc\+\+-6|libgcc_s_seh'; then
            echo "Standalone runtime check failed: MinGW runtime DLL dependency detected."
            exit 1
          fi

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\\Gatito-Dtb-Pacher.exe -DestinationPath Gatito-Dtb-Pacher-Windows-Native.zip -Force

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: Gatito Dtb Pacher-Windows-Native
          path: Gatito-Dtb-Pacher-Windows-Native.zip
