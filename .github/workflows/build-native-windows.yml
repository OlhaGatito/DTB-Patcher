name: Build Native C++ Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Gatito DTB-Patcher
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            make
            flex
            bison
            pkgconf
            diffutils
            mingw-w64-ucrt-x86_64-gcc

      - name: Build pinned official DTC
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          bash native/build_dtc_msys2.sh "$PWD" /tmp/gatito-dtb-patcher-dtc

      - name: Build native application and regression tests
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          bash native/build_native_msys2.sh "$PWD" /tmp/gatito-dtb-patcher-dtc

      - name: Verify runtime dependencies
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          deps="$(ldd build/Gatito-DTB-Patcher.exe 2>/dev/null || true)"
          echo "$deps"
          if echo "$deps" | grep -Eiq 'libwinpthread|libstdc\+\+-6|libgcc_s_seh'; then
            echo "Standalone runtime check failed: MinGW runtime DLL dependency detected."
            exit 1
          fi

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\\Gatito-DTB-Patcher.exe")) { throw "Native executable was not produced." }
          Get-Item "build\\Gatito-DTB-Patcher.exe" | Select-Object FullName,Length

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\\Gatito-DTB-Patcher.exe -DestinationPath Gatito-DTB-Patcher-Windows-Native.zip -Force

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: Gatito DTB-Patcher-Windows-Native
          path: Gatito-DTB-Patcher-Windows-Native.zip
