name: Build Native C++ Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout DTB-Patcher
        uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            flex
            bison
            pkgconf
            diffutils
            mingw-w64-ucrt-x86_64-gcc

      - name: Build official DTC sources
        shell: msys2 {0}
        run: |
          rm -rf /tmp/dtc
          git clone --depth 1 https://github.com/dgibson/dtc.git /tmp/dtc
          cd /tmp/dtc
          make NO_YAML=1 NO_PYTHON=1 dtc libfdt

      - name: Compile native DTB-Patcher
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          DTC=/tmp/dtc
          mkdir -p build
          gcc -Dmain=dtc_internal_main -DNO_YAML -I"$DTC" -I"$DTC/libfdt" -c "$DTC/dtc.c" -o build/dtc_embedded.o
          gcc -DNO_YAML -I"$DTC" -I"$DTC/libfdt" -c native/dtc_bridge.c -o build/dtc_bridge.o
          g++ -std=c++17 -O2 -mwindows -I"$DTC" -I"$DTC/libfdt" native/main.cpp native/dtb_model.cpp build/dtc_bridge.o build/dtc_embedded.o "$DTC/checks.o" "$DTC/data.o" "$DTC/flattree.o" "$DTC/fstree.o" "$DTC/livetree.o" "$DTC/srcpos.o" "$DTC/treesource.o" "$DTC/util.o" "$DTC/dtc-lexer.lex.o" "$DTC/dtc-parser.tab.o" "$DTC/libfdt/libfdt.a" -static -static-libgcc -static-libstdc++ -lgdiplus -lcomctl32 -o build/DTB-Patcher.exe

      - name: Native DTC smoke test
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          DTC=/tmp/dtc
          g++ -std=c++17 -O2 -I"$DTC" -I"$DTC/libfdt" native/test_dtc.cpp build/dtc_bridge.o build/dtc_embedded.o "$DTC/checks.o" "$DTC/data.o" "$DTC/flattree.o" "$DTC/fstree.o" "$DTC/livetree.o" "$DTC/srcpos.o" "$DTC/treesource.o" "$DTC/util.o" "$DTC/dtc-lexer.lex.o" "$DTC/dtc-parser.tab.o" "$DTC/libfdt/libfdt.a" -static-libgcc -static-libstdc++ -o build/test_dtc.exe
          ./build/test_dtc.exe tests/native-smoke.dts build/smoke

      - name: Verify executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\\DTB-Patcher.exe")) { throw "Native executable was not produced." }
          Get-Item "build\\DTB-Patcher.exe" | Select-Object FullName,Length

      - name: Verify runtime dependencies
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          deps="$(ldd build/DTB-Patcher.exe 2>/dev/null || true)"
          echo "$deps"
          if echo "$deps" | grep -Eiq 'libwinpthread|libstdc\+\+-6|libgcc_s_seh'; then
            echo "Standalone runtime check failed: MinGW runtime DLL dependency detected."
            exit 1
          fi

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build\\DTB-Patcher.exe -DestinationPath DTB-Patcher-Windows-Native.zip -Force

      - name: Upload native build
        uses: actions/upload-artifact@v4
        with:
          name: DTB-Patcher-Windows-Native
          path: DTB-Patcher-Windows-Native.zip
